apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - ../../base
configMapGenerator:
  - name: shop-site
    behavior: merge
    files:
      - env.js
patches:
  - target:
      kind: Ingress
      name: shop
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.shop.localtest.me
