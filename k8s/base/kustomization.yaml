apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hook-presync.yaml
  - hook-postsync.yaml
configMapGenerator:
  - name: shop-site
    files:
      - site/index.html
      - site/style.css
      - site/app.js
      - site/products.js
      - site/env.js
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "0"
