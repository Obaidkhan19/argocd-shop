apiVersion: batch/v1
kind: Job
metadata:
  name: shop-postsync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: postsync
          image: busybox:1.36
          command: ["sh", "-c", "echo 'PostSync: smoke test / notify team'"]
