apiVersion: batch/v1
kind: Job
metadata:
  name: shop-presync
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: presync
          image: busybox:1.36
          command: ["sh", "-c", "echo 'PreSync: pre-deploy checks (e.g. DB backup)'"]
